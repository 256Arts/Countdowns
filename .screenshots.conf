# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Countdowns.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.256arts.countdowns"   # used to clear saved Mac window frames
MAC_APP_NAME="Countdowns"                # the process name, for finding its window (Mac only)
PLATFORMS="iphone ipad mac vision watch" # the watch app ships inside the iOS listing, which takes
                                         # an Apple Watch screenshot set of its own

# Slot 1 of every listing is the widgets on a wallpaper — the Home Screen widgets and Lock Screen
# accessories on iPhone and iPad, and on the Mac the menu bar extra, open. The app draws them itself
# (`WidgetShots`, launched `-screenshotMode -widgetShots`) and the shared `widget-screenshots` lays
# them out; see the top of that script for the keys.
WIDGET_RENDER="iphone mac"
WIDGET_TILES="Raw Assets/Screenshots/Widgets and Menu Bar"
WIDGET_SHOTS="
  widgets        = Every countdown, at a glance. | Lock Screen, Small Light, Small Dark, Large Light, Medium Dark
  iphone widgets = Every countdown, at a glance. | Lock Screen, Large Light, Small Light, Small Dark
  mac widgets    = Every countdown, at a glance. | Medium Light, glass: Menu Bar Extra, Small Light, Small Dark
"
IPHONE_MANUAL_SHOTS="1"
IPAD_MANUAL_SHOTS="1"
# The Mac's slot 2 is hand-made: the editor popover, which a run cannot photograph there because
# `screencapture -l` takes one window and a popover is its own.
MAC_MANUAL_SHOTS="1 2"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix, by "widgets-<name>" for a widget shot, or by a whole filename for a hand-made slot, which has no
# capture to be named after.
SHOT_DESCRIPTIONS="
  widgets-widgets = The widgets on a wallpaper — a Lock Screen with its accessories, and the small
                    and list widgets in light and dark (on the Mac the menu bar extra, open) —
                    under the title “Every countdown, at a glance.”
  Mac 2           = Hand-made: a countdown being edited, its popover open beside the window
  movie           = A movie release countdown, poster and all, on its detail screen
  upcoming        = The Upcoming list, each countdown showing the days remaining
  edit            = A countdown being edited, with its date, colour, symbol and yearly repeat
  import-calendar = Importing a system calendar, with a calendar picked and a colour and symbol
                    to file its events under
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="countdowns"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  widgets-widgets = Your next date, on the Lock Screen, Home Screen and menu bar.
  upcoming        = The whole year ahead, counting down.
  movie           = Films and shows, counted down from the poster.
  edit            = Give every countdown its own colour, symbol and rhythm.
  import-calendar = Bring a calendar in, and it counts itself down.
"
