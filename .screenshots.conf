# Read by the shared `screenshots` runner in Apps/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Countdowns.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.256arts.countdowns"   # used to clear saved Mac window frames
MAC_APP_NAME="Countdowns"                # the process name, for finding its window (Mac only)
PLATFORMS="iphone ipad mac vision"       # the app ships no watchOS store listing of its own
