# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Countdowns.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.256arts.countdowns"   # used to clear saved Mac window frames
MAC_APP_NAME="Countdowns"                # the process name, for finding its window (Mac only)
PLATFORMS="iphone ipad mac vision"       # the app ships no watchOS store listing of its own

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  upcoming      = The Upcoming list, every seeded countdown showing the days remaining
  event         = A countdown's detail screen — the seeded birthday, with its Repeats Yearly schedule
  common-events = The Common Event sheet, picking a holiday or seasonal date to count down to
  new-event     = The New Event sheet, building a custom countdown
"
